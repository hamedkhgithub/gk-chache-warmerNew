name: GeniusKala Cache Warmer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Browser profile
        required: true
        default: both
        type: choice
        options:
          - both
          - mobile
          - desktop

      auth:
        description: Cache view to warm
        required: true
        default: both
        type: choice
        options:
          - both
          - guest
          - logged_in

      delay:
        description: Seconds between URLs
        required: true
        default: "5"
        type: string

      verify_delay:
        description: Seconds before HIT verification
        required: true
        default: "2"
        type: string

  # GitHub cron uses UTC.
  # Scheduled run remains GUEST by default so it never fails if login secrets
  # are not configured. Change AUTH fallback below to "both" after adding secrets
  # if you want scheduled logged-in warming too.
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: geniuskala-cache-warmer
  cancel-in-progress: false

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cache warmer
        shell: bash
        env:
          GK_WP_USERNAME: ${{ secrets.GK_WP_USERNAME }}
          GK_WP_PASSWORD: ${{ secrets.GK_WP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'both' }}"
          AUTH="${{ github.event.inputs.auth || 'guest' }}"
          DELAY="${{ github.event.inputs.delay || '5' }}"
          VERIFY_DELAY="${{ github.event.inputs.verify_delay || '2' }}"

          python -u crawler.py \
            --file urls.txt \
            --mode "$MODE" \
            --auth "$AUTH" \
            --delay "$DELAY" \
            --verify-delay "$VERIFY_DELAY" \
            --timeout 45

      - name: Upload crawler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-warmer-report-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
