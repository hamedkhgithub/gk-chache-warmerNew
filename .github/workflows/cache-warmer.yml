name: GeniusKala Cache Warmer

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Paste URLs here - one per line"
        required: true
        type: string

      device:
        description: "Device cache"
        required: true
        default: "mobile"
        type: choice
        options:
          - both
          - desktop
          - mobile

      navigation:
        description: "Navigation type"
        required: true
        default: "internal"
        type: choice
        options:
          - direct
          - internal
          - both

      delay:
        description: "Seconds between URLs"
        required: true
        default: "3"
        type: string

      verify_delay:
        description: "Seconds before verification"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: geniuskala-cache-warmer
  cancel-in-progress: false

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Prepare URLs
        shell: bash
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
        run: |
          printf '%s\n' "$INPUT_URLS" > runtime-urls.txt
          echo "URL count: $(grep -cvE '^[[:space:]]*(#|$)' runtime-urls.txt)"

      - name: Run cache warmer
        shell: bash
        run: |
          python -u crawler.py \
            --file runtime-urls.txt \
            --device "${{ github.event.inputs.device }}" \
            --navigation "${{ github.event.inputs.navigation }}" \
            --auth guest \
            --delay "${{ github.event.inputs.delay }}" \
            --verify-delay "${{ github.event.inputs.verify_delay }}" \
            --timeout 60

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-warmer-report-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
